# Nginx reverse-proxy config for Power Automation
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled.
# SSL certificates issued via Certbot (certbot --nginx -d powerautomation.uz ...).

gzip on;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
gzip_min_length 1024;

proxy_cache_path /var/cache/nginx/pa levels=1:2 keys_zone=pa_static:10m max_size=500m inactive=60m use_temp_path=off;

# ---------------- Main website ----------------
server {
    listen 80;
    server_name powerautomation.uz www.powerautomation.uz;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache pa_static;
        proxy_cache_valid 200 60m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------- API ----------------
server {
    listen 80;
    server_name api.powerautomation.uz;
    client_max_body_size 25m;

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache pa_static;
        proxy_cache_valid 200 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------- Admin panel ----------------
server {
    listen 80;
    server_name admin.powerautomation.uz;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
